<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>{{ diario.titulo }}</title>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl p-8">

        <h1 class="text-3xl font-bold text-gray-800">{{ diario.titulo }}</h1>
        <p class="text-sm text-gray-500 mt-1 mb-6">
            {{ diario.user.username }} · {{ diario.fecha_creacion|date:"d/m/Y H:i" }}
        </p>

        <p class="text-gray-700 whitespace-pre-line mb-8">{{ diario.contenido }}</p>

        <div class="flex gap-3">
            <a href="{% url 'diario_list' %}"
               class="flex-1 text-center bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 rounded-lg transition">
                Volver
            </a>
            <a href="{% url 'diario_update' diario.pk %}"
               class="flex-1 text-center bg-yellow-500 hover:bg-yellow-600 text-white font-semibold py-2 rounded-lg transition">
                Editar
            </a>
            <a href="{% url 'diario_delete' diario.pk %}"
               class="flex-1 text-center bg-red-600 hover:bg-red-700 text-white font-semibold py-2 rounded-lg transition">
                Eliminar
            </a>
        </div>

    </div>
</body>
</html>
