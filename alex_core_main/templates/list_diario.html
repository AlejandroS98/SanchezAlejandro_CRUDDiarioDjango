<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Mis diarios</title>
</head>

<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-3xl mx-auto">

        <div class="flex items-center justify-between mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Mis diarios</h1>
            <a href="{% url 'diario_create' %}"
               class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition">
                + Nuevo
            </a>
        </div>

        <div class="space-y-4">
            {% for diario in diarios %}
            <div class="bg-white rounded-2xl shadow p-6">
                <h2 class="text-xl font-semibold text-gray-800">{{ diario.titulo }}</h2>
                <p class="text-sm text-gray-500 mb-3">
                    {{ diario.user.username }} · {{ diario.fecha_creacion|date:"d/m/Y H:i" }}
                </p>
                <p class="text-gray-600 mb-4">{{ diario.contenido|truncatechars:120 }}</p>

                <div class="flex gap-3 text-sm font-semibold">
                    <a href="{% url 'diario_detail' diario.pk %}" class="text-blue-600 hover:underline">Ver</a>
                    <a href="{% url 'diario_update' diario.pk %}" class="text-yellow-600 hover:underline">Editar</a>
                    <a href="{% url 'diario_delete' diario.pk %}" class="text-red-600 hover:underline">Eliminar</a>
                </div>
            </div>
            {% empty %}
            <p class="text-center text-gray-500">Todavía no hay entradas en el diario.</p>
            {% endfor %}
        </div>

    </div>
</body>
</html>
