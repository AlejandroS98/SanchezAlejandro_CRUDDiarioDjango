<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Eliminar entrada</title>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 text-center">

        <h1 class="text-2xl font-bold text-gray-800 mb-2">¿Eliminar entrada?</h1>
        <p class="text-gray-600 mb-6">
            Vas a eliminar <strong>{{ diario.titulo }}</strong>. Esta acción no se puede deshacer.
        </p>

        <form method="post" class="flex gap-3">
            {% csrf_token %}
            <a href="{% url 'diario_list' %}"
               class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 rounded-lg transition">
                Cancelar
            </a>
            <button type="submit"
                    class="flex-1 bg-red-600 hover:bg-red-700 text-white font-semibold py-2 rounded-lg transition">
                Sí, eliminar
            </button>
        </form>

    </div>
</body>
</html>
